<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jack Miller / Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/override.css">
</head>
  <body>
      <div class="content-wrapper col-xl-5 col-lg-10 col-md-10 col-sm-10 col-12">
        <div class="container-fluid">
          <div class="row gy-3">
            <div class="col-12">
              <div class="row gx-3 titlebar align-items-center">
                  <div class="col-6">
                    <h1 class="mb-0 glass-overlay d-flex align-items-center">Hello, I'm Jack.</h1>
                  </div>
                
                  <div class="col-6">
                    <div class="links glass-overlay d-flex align-items-center justify-content-end h-100">
                        <div>
                          <a href="Home" class="me-3">{home}</a>
                          <a href="Home" class="me-3">{projects}</a>
                          <a href="Home">{contact}</a>
                        </div>
                    </div>
                  </div>
              </div>
            </div>
            
            <div class="col-12">
              <div class="glass-overlay">
                <div class="image-container hero-image" id=""></div>
              </div>
            </div>

            <div class="col-12">
              <div class="intro-body glass-overlay">
                <p>I am a second year Computer Science student at the University of Utah. With skills in Java, Swift, Python, and others.

                  Outside of CS, I am skilled in Pro Audio Visial work, as well as Networking.
                </p>
              </div>
            </div>

            <!--Skill boxes-->

            <div class="col-12">
              <div class="row gx-3 gy-3">
                <div class="col-md-6 col-sm-12">
                  <div class="glass-overlay d-flex align-items-center skills-box" id="java">
                    <h2 class="mb-0 skill-title">Java</h2>
                  </div>
                </div>
                <div class="col-md-6 col-sm-12">
                  <div class="glass-overlay d-flex align-items-center skills-box" id="swift">
                    <h2 class="mb-0 skill-title">Swift</h2>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12">
              <div class="row gx-3 gy-3">
                <div class="col-md-12 col-sm-12">
                  <div class="glass-overlay d-flex align-items-center skills-box" id="av">
                    <h2 class="mb-0 skill-title">Pro AV</h2>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12">
              <div class="row gx-3 gy-3">
                <div class="col-md-12 col-sm-12">
                  <div class="glass-overlay d-flex align-items-center skills-box">
                    <h2 class="mb-0 skill-title">Networking</h2>
                  </div>
                </div>
              </div>
            </div>
            
            <div class="col-12">
              <div class="glass-overlay skills-collection">
        
      </div>
            </div>
          </div>
        </div>
      </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
